<script>
(function(){
  "use strict";

  /* ===== TEMPO DE LIBERACAO (segundos) — 04:21 = 261 ===== */
  var REVEAL_AT = 261;

  var revealed = false;
  var el = document.getElementById('reveal');

  function reveal(){
    if(revealed) return;
    revealed = true;
    el.classList.add('show');
    fireConfetti();
    setTimeout(function(){
      try{ el.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
    }, 260);
  }

  /* --- 1) tempo real do player VTurb --- */
  var hooked = false, tries = 0;
  var poll = setInterval(function(){
    tries++;
    if(hooked || revealed || tries > 100){ clearInterval(poll); return; }

    var sp = window.smartplayer;
    var inst = sp && sp.instances && sp.instances.length ? sp.instances[0] : null;
    if(!inst) return;

    try{
      if(typeof inst.on === 'function'){
        inst.on('timeupdate', function(){
          var t = currentTime(inst);
          if(t !== null && t >= REVEAL_AT) reveal();
        });
        hooked = true;
      }
    }catch(e){}

    if(!hooked){
      hooked = true;
      setInterval(function(){
        if(revealed) return;
        var t = currentTime(inst);
        if(t !== null && t >= REVEAL_AT) reveal();
      }, 500);
    }
    clearInterval(poll);
  }, 300);

  function currentTime(inst){
    try{
      if(typeof inst.currentTime === 'number') return inst.currentTime;
      if(inst.video && typeof inst.video.currentTime === 'number') return inst.video.currentTime;
    }catch(e){}
    var v = document.querySelector('vturb-smartplayer video') || document.querySelector('video');
    if(v && typeof v.currentTime === 'number' && !isNaN(v.currentTime)) return v.currentTime;
    return null;
  }

  /* --- 2) rede de seguranca --- */
  setTimeout(reveal, (REVEAL_AT + 2) * 1000);


  /* ===== CONFETE ===== */
  function fireConfetti(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var canvas = document.getElementById('confetti');
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var W, H;

    function size(){
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = W*dpr; canvas.height = H*dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    size();
    window.addEventListener('resize', size);

    var colors = ['#c9a84c','#e3c977','#219653','#27b163','#f0ede6','#a8862f'];
    var parts = [];
    var COUNT = window.innerWidth < 520 ? 90 : 150;

    for(var i=0;i<COUNT;i++){
      parts.push({
        x: W/2 + (Math.random()-.5)*W*.6,
        y: -20 - Math.random()*H*.3,
        w: 6 + Math.random()*6,
        h: 9 + Math.random()*8,
        color: colors[(Math.random()*colors.length)|0],
        vx: (Math.random()-.5)*2.4,
        vy: 2.2 + Math.random()*3.2,
        rot: Math.random()*Math.PI,
        vr: (Math.random()-.5)*.24,
        sway: Math.random()*Math.PI*2
      });
    }

    var start = performance.now(), DURATION = 3400;

    (function frame(now){
      var elapsed = now - start;
      ctx.clearRect(0,0,W,H);
      var fade = elapsed > DURATION-900 ? Math.max(0,(DURATION-elapsed)/900) : 1;

      for(var i=0;i<parts.length;i++){
        var p = parts[i];
        p.sway += .05;
        p.x += p.vx + Math.sin(p.sway)*.9;
        p.y += p.vy;
        p.rot += p.vr;

        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      }

      if(elapsed < DURATION) requestAnimationFrame(frame);
      else ctx.clearRect(0,0,W,H);
    })(start);
  }

})();
</script>
